<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Кот СЭМ — Перейди дорогу (3D)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#18241b;overflow:hidden;touch-action:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;border-radius:10px;background:#bfe6ff}
  canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  #fx{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden}
  .ft{position:absolute;font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4);transform:translate(-50%,-50%);white-space:nowrap;display:none}
  .ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;background:rgba(15,25,18,.55)}
  .ov.show{display:flex}
  h1{margin:0 0 6px;font-size:40px;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
  h2{margin:0 0 10px;font-size:30px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
  p{margin:4px 0 14px;font-size:16px;opacity:.95;line-height:1.35}
  button{font:inherit;font-weight:700;font-size:19px;border:0;border-radius:16px;padding:14px 26px;margin:6px 0;min-width:240px;cursor:pointer;
    color:#fff;background:#3f8cff;box-shadow:0 5px 0 #2a63b8}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #2a63b8}
  button:disabled{opacity:.45;cursor:default}
  button.alt{background:#ff9f1c;box-shadow:0 5px 0 #c27400}
  button.alt:active{box-shadow:0 2px 0 #c27400}
  button.sm{min-width:0;font-size:15px;padding:8px 12px;margin:0;box-shadow:0 3px 0 #2a63b8}
  #hud{position:absolute;left:0;right:0;top:0;display:none;justify-content:space-between;align-items:flex-start;padding:10px 14px;pointer-events:none;box-sizing:border-box}
  #hud.show{display:flex}
  #score{font-size:54px;font-weight:800;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35)}
  #fish{font-size:22px;font-weight:700;background:rgba(0,0,0,.35);border-radius:14px;padding:6px 12px;margin-top:6px}
  #pad{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px}
  #pad.show{display:grid}
  .pb{width:64px;height:64px;min-width:0;margin:0;padding:0;border-radius:18px;border:0;background:rgba(255,255,255,.4);color:#fff;font-size:26px;font-weight:800;
    box-shadow:0 4px 0 rgba(0,0,0,.25);touch-action:manipulation;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .pb:active{transform:translateY(2px);background:rgba(255,255,255,.6)}
  .small{font-size:13px;opacity:.8;margin-top:10px}
  .card{display:flex;align-items:center;justify-content:space-between;gap:10px;width:min(330px,92%);background:rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;margin:6px 0;text-align:left}
  .card b{font-size:17px}
  #adbox{border:2px dashed rgba(255,255,255,.6);border-radius:14px;padding:22px 26px;margin:10px 0 0}
  #adnum{font-size:56px;font-weight:800}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="fx"></div>
  <div id="hud"><div id="score">0</div><div id="fish">🐟 0</div></div>

  <div id="pad">
    <button class="pb" id="pU" style="grid-row:1;grid-column:2">▲</button>
    <button class="pb" id="pL" style="grid-row:2;grid-column:1">◀</button>
    <button class="pb" id="pD" style="grid-row:2;grid-column:2">▼</button>
    <button class="pb" id="pR" style="grid-row:2;grid-column:3">▶</button>
  </div>

  <div id="menu" class="ov show">
    <h1>Кот СЭМ</h1>
    <p>Помоги Сэму перейти дороги, рельсы и реку.<br>Собирай рыбок, лови щиты и не засиживайся на месте!</p>
    <button id="play">Играть</button>
    <button id="shopBtn" class="alt">Скины</button>
    <button id="chestBtn">Сундук</button>
    <div class="small">Тап / ↑ — вперёд · свайп или стрелки — в стороны и назад</div>
  </div>

  <div id="over" class="ov">
    <h2 id="overTitle">Сэм не успел 😿</h2>
    <p>Счёт: <b id="oScore">0</b> · Рекорд: <b id="oBest">0</b><br>Рыбок за забег: <b id="oFish">0</b></p>
    <button id="revive" class="alt">▶ Продолжить за рекламу</button>
    <button id="dbl">✚ Удвоить рыбки за рекламу</button>
    <button id="again">Ещё раз</button>
    <button id="homeBtn" class="sm">В меню</button>
  </div>

  <div id="shop" class="ov">
    <h2>Скины</h2>
    <div id="shopList"></div>
    <button id="shopClose" class="sm" style="margin-top:14px">Назад</button>
  </div>

  <div id="ad" class="ov">
    <h2 id="adTitle">Реклама (демо)</h2>
    <div id="adbox"><div>Здесь будет ролик<br>рекламной сети</div><div id="adnum">3</div></div>
  </div>
</div>

<script>
(function(){
"use strict";
if(typeof THREE==='undefined'){ document.getElementById('menu').innerHTML='<p>3D-библиотека не загрузилась. Обнови страницу.</p>'; return; }

const COLS=9, VR=16, W=432, H=768, STEP=1/60;
const HALF_W=5, HALF_H=HALF_W*H/W;
const $=id=>document.getElementById(id);
const stage=$('stage'), canvas=$('c'), fxBox=$('fx');
const hud=$('hud'), elScore=$('score'), elFish=$('fish');
const menu=$('menu'), over=$('over'), adOv=$('ad'), shop=$('shop'), pad=$('pad');

// ---------- renderer / scene ----------
const renderer=new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xbfe6ff);
scene.fog=new THREE.Fog(0xbfe6ff,16,40);
const camera=new THREE.OrthographicCamera(-HALF_W,HALF_W,HALF_H,-HALF_H,0.1,200);
const hemi=new THREE.HemisphereLight(0xfff4dc,0x5d8a4c,1.0); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe2ae,1.4);
sun.castShadow=true;
sun.shadow.mapSize.width=1024; sun.shadow.mapSize.height=1024;
sun.shadow.camera.left=-10; sun.shadow.camera.right=10; sun.shadow.camera.top=12; sun.shadow.camera.bottom=-12;
sun.shadow.camera.near=1; sun.shadow.camera.far=80; sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias=-0.0008;
scene.add(sun); scene.add(sun.target);

let stageW=W, stageH=H;
function resize(){
  const s=Math.min(window.innerWidth/W, window.innerHeight/H);
  stageW=Math.floor(W*s); stageH=Math.floor(H*s);
  stage.style.width=stageW+'px'; stage.style.height=stageH+'px';
  renderer.setSize(stageW,stageH,false);
}
window.addEventListener('resize',resize); resize();

// ---------- biomes: every 25 rows the look changes ----------
const BIOMES=[
  {sky:0xbfe6ff, grass:['#8fd14f','#9bd95a'], road:'#4a4f58', rail:'#8b8478', hemi:1.0,  sun:1.4,  weather:'none', river:false},
  {sky:0xcdeeff, grass:['#7fcf5a','#8fdc66'], road:'#55595f', rail:'#8b8478', hemi:1.05, sun:1.3,  weather:'none', river:true },
  {sky:0x8fa3b5, grass:['#6fa84a','#7cb754'], road:'#3d4249', rail:'#6e6a62', hemi:0.8,  sun:0.8,  weather:'rain', river:true },
  {sky:0x1d2a4a, grass:['#3e6b3c','#48794a'], road:'#2a2e36', rail:'#4a463f', hemi:0.5,  sun:0.35, weather:'snow', river:false}
];
const biomeOf=r=>BIOMES[Math.floor(Math.max(0,r)/25)%4];

// ---------- geometry / materials (shared) ----------
const G={
  box:new THREE.BoxGeometry(1,1,1),
  sph:new THREE.SphereGeometry(1,14,10),
  cyl:new THREE.CylinderGeometry(1,1,1,10),
  cone:new THREE.ConeGeometry(1,1,8),
  ico:new THREE.IcosahedronGeometry(1,0)
};
const MAT={};
function mat(c){ return MAT[c]||(MAT[c]=new THREE.MeshLambertMaterial({color:c})); }
const shieldMat=new THREE.MeshBasicMaterial({color:0x7fe7ff, transparent:true, opacity:0.25});
function mesh(g,c,x,y,z,sx,sy,sz){
  const m=new THREE.Mesh(g,mat(c));
  m.position.set(x||0,y||0,z||0);
  if(sx!==undefined) m.scale.set(sx,sy,sz);
  m.castShadow=true; m.receiveShadow=true;
  return m;
}
// column coordinate (left edge of a cell, 0..9) -> world X; the screen's right side is world -X
const wx=u=>4.5-u;

// ---------- models ----------
function buildCat(look){
  const L=Object.assign({sweater:'#6f98c9', pants:'#5f8f45'}, look||{});
  const g=new THREE.Group();
  const body=new THREE.Group(); g.add(body);
  body.add(mesh(G.cyl,L.pants,-0.13,0.2,0,0.14,0.4,0.14));
  body.add(mesh(G.cyl,L.pants, 0.13,0.2,0,0.14,0.4,0.14));
  body.add(mesh(G.sph,'#7c7d83',-0.13,0.05,0.06,0.13,0.08,0.15));
  body.add(mesh(G.sph,'#7c7d83', 0.13,0.05,0.06,0.13,0.08,0.15));
  body.add(mesh(G.sph,L.sweater,0,0.5,0,0.36,0.32,0.32));
  body.add(mesh(G.sph,L.sweater,-0.32,0.5,0.02,0.11,0.22,0.12));
  body.add(mesh(G.sph,L.sweater, 0.32,0.5,0.02,0.11,0.22,0.12));
  body.add(mesh(G.sph,'#7c7d83',-0.32,0.27,0.08,0.1,0.09,0.11));
  body.add(mesh(G.sph,'#7c7d83', 0.32,0.27,0.08,0.1,0.09,0.11));
  if(L.scarf) body.add(mesh(G.cyl,L.scarf,0,0.76,0.02,0.27,0.09,0.27));
  const head=new THREE.Group(); head.position.set(0,0.98,0.02); body.add(head);
  head.add(mesh(G.sph,'#7c7d83',0,0,0,0.34,0.3,0.31));
  const earL=mesh(G.cone,'#6a6b70',-0.22,0.27,0,0.13,0.12,0.07); earL.rotation.z=0.5; head.add(earL);
  const earR=mesh(G.cone,'#6a6b70', 0.22,0.27,0,0.13,0.12,0.07); earR.rotation.z=-0.5; head.add(earR);
  head.add(mesh(G.sph,'#8c8d93',-0.16,-0.1,0.24,0.11,0.08,0.06));
  head.add(mesh(G.sph,'#8c8d93', 0.16,-0.1,0.24,0.11,0.08,0.06));
  for(const s of [-1,1]){
    head.add(mesh(G.sph,'#ffffff',s*0.13,0.03,0.27,0.085,0.085,0.07));
    head.add(mesh(G.sph,'#f0a41c',s*0.13,0.03,0.31,0.055,0.055,0.04));
    head.add(mesh(G.sph,'#1b1b1b',s*0.13,0.03,0.34,0.03,0.03,0.02));
  }
  const nose=mesh(G.cone,'#55565b',0,-0.05,0.31,0.05,0.05,0.04); nose.rotation.x=Math.PI/2; head.add(nose);
  if(L.hat){
    head.add(mesh(G.cyl,L.hat,0,0.3,0,0.3,0.14,0.3));
    head.add(mesh(G.cyl,L.hat,0,0.23,0.04,0.36,0.04,0.34));
  }
  const tail=mesh(G.cyl,'#6b6c72',0.27,0.25,-0.24,0.06,0.44,0.06);
  tail.rotation.z=-0.6; body.add(tail);
  const shield=new THREE.Mesh(G.sph,shieldMat);
  shield.scale.set(0.8,0.8,0.8); shield.position.set(0,0.55,0); shield.visible=false; g.add(shield);
  return {g:g, body:body, head:head, tail:tail, shield:shield};
}
function makeTree(){
  const g=new THREE.Group();
  g.add(mesh(G.cyl,'#7a4a24',0,0.35,0,0.14,0.7,0.14));
  g.add(mesh(G.ico,'#2f8f46',0,0.95,0,0.5,0.5,0.5));
  g.add(mesh(G.ico,'#43ad5b',0.12,1.15,0.1,0.3,0.3,0.3));
  return g;
}
function makeFish(){
  const g=new THREE.Group();
  g.add(mesh(G.sph,'#5ec8ff',0,0,0,0.22,0.14,0.12));
  const tail=mesh(G.cone,'#5ec8ff',-0.26,0,0,0.12,0.14,0.12); tail.rotation.z=Math.PI/2; g.add(tail);
  g.add(mesh(G.sph,'#ffffff',0.12,0.03,0.07,0.04,0.04,0.04));
  return g;
}
function makePower(){
  return mesh(G.ico,'#7fe7ff',0,0.55,0,0.28,0.28,0.28);
}
// f = world sign of the motion direction (+1 moves right on screen, -1 moves left)
function makeCar(w,truck,col,f){
  const g=new THREE.Group();
  if(truck){
    g.add(mesh(G.box,'#e8e8ee',-f*w*0.16,0.5,0,w*0.68,0.7,0.82));
    g.add(mesh(G.box,col,f*w*0.36,0.45,0,w*0.28,0.6,0.84));
    g.add(mesh(G.box,'#bfe8ff',f*w*0.42,0.66,0,w*0.1,0.22,0.86));
  } else {
    g.add(mesh(G.box,col,0,0.36,0,w*0.92,0.42,0.78));
    g.add(mesh(G.box,'#bfe8ff',0,0.72,0,w*0.52,0.26,0.72));
  }
  for(const x of [-w*0.3,w*0.3]) for(const z of [-0.42,0.42]){
    const wh=mesh(G.cyl,'#222222',x,0.14,z,0.14,0.1,0.14); wh.rotation.x=Math.PI/2; g.add(wh);
  }
  g.add(mesh(G.sph,'#ffe58a',f*w*0.46,0.34,0.25,0.07,0.07,0.07));
  g.add(mesh(G.sph,'#ffe58a',f*w*0.46,0.34,-0.25,0.07,0.07,0.07));
  return g;
}
function makeTrain(len){
  const g=new THREE.Group();
  g.add(mesh(G.box,'#b8323a',0,0.55,0,len,0.8,0.78));
  g.add(mesh(G.box,'#bfe8ff',0,0.72,0,len-0.3,0.26,0.8));
  g.add(mesh(G.box,'#e8e8ee',0,0.22,0,len,0.12,0.8));
  return g;
}
function makeLog(w){
  return mesh(G.box,'#8a5a2b',0,0.15,0,w,0.3,0.8);
}

// ---------- effects: dust pool, floating text, pickup pops, precipitation ----------
const dust=[];
for(let i=0;i<40;i++){
  const m=new THREE.Mesh(G.sph,mat('#f4ecd8')); m.visible=false; m.castShadow=false; scene.add(m);
  dust.push({m:m, life:0, vx:0, vy:0, vz:0});
}
let dustIdx=0;
function spawnDust(x,z,n,color){
  for(let i=0;i<n;i++){
    const p=dust[dustIdx]; dustIdx=(dustIdx+1)%dust.length;
    p.m.visible=true; p.m.material=mat(color||'#f4ecd8');
    p.m.position.set(x+(Math.random()-.5)*.4,0.1,z+(Math.random()-.5)*.4);
    p.m.scale.set(.12,.12,.12);
    p.vx=(Math.random()-.5)*1.6; p.vy=1+Math.random()*1.4; p.vz=(Math.random()-.5)*1.6; p.life=0.45;
  }
}
function dustUpdate(dt){
  for(const p of dust){
    if(p.life<=0) continue;
    p.life-=dt;
    p.m.position.x+=p.vx*dt; p.m.position.y+=p.vy*dt; p.m.position.z+=p.vz*dt;
    p.vy-=6*dt;
    if(p.life<=0){ p.m.visible=false; }
    else { const s=Math.max(0.01,p.life*0.3); p.m.scale.set(s,s,s); }
  }
}

const fxPool=[];
for(let i=0;i<6;i++){
  const d=document.createElement('div'); d.className='ft'; fxBox.appendChild(d);
  fxPool.push({el:d, life:0, x:0, y:0, z:0});
}
let fxIdx=0;
function fxText(txt,x,y,z,color){
  const f=fxPool[fxIdx]; fxIdx=(fxIdx+1)%fxPool.length;
  f.el.textContent=txt; f.el.style.color=color||'#fff'; f.el.style.display='block';
  f.x=x; f.y=y; f.z=z; f.life=0.9;
}
const _v=new THREE.Vector3();
function fxUpdate(dt){
  for(const f of fxPool){
    if(f.life<=0) continue;
    f.life-=dt; f.y+=dt*1.2;
    _v.set(f.x,f.y,f.z); _v.project(camera);
    f.el.style.left=((_v.x*0.5+0.5)*stageW)+'px';
    f.el.style.top=((-_v.y*0.5+0.5)*stageH)+'px';
    f.el.style.opacity=Math.min(1,f.life*2).toFixed(2);
    if(f.life<=0) f.el.style.display='none';
  }
}
const pops=[];   // fish scale-up pop when collected
function popsUpdate(dt){
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.t+=dt;
    const s=1+p.t*4; p.obj.scale.set(s,s,s);
    if(p.t>0.2){ p.obj.visible=false; pops.splice(i,1); }
  }
}

const PN=90;
const pRel=new Float32Array(PN);
const pPos=new Float32Array(PN*3);
for(let i=0;i<PN;i++){ pRel[i]=(Math.random()-.5)*14; pPos[i*3]=(Math.random()-.5)*12; pPos[i*3+1]=Math.random()*8; pPos[i*3+2]=0; }
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
const pMat=new THREE.PointsMaterial({color:0xcfe6ff, size:0.06, transparent:true, opacity:0.7, depthWrite:false});
const precip=new THREE.Points(pGeo,pMat);
precip.frustumCulled=false; precip.visible=false; scene.add(precip);
function precipUpdate(dt,bio,zc){
  const on=bio.weather!=='none';
  precip.visible=on;
  if(!on) return;
  const snow=bio.weather==='snow';
  pMat.color.set(snow?0xffffff:0xa8c8e8);
  pMat.size=snow?0.09:0.05;
  for(let i=0;i<PN;i++){
    pPos[i*3+1]-=(snow?2.2:13)*dt;
    if(snow) pPos[i*3]+=Math.sin(time*1.3+i)*0.3*dt;
    if(pPos[i*3+1]<0){
      pPos[i*3+1]=6+Math.random()*3; pPos[i*3]=(Math.random()-.5)*12;
    }
    pPos[i*3+2]=zc+pRel[i];
  }
  pGeo.attributes.position.needsUpdate=true;
}

// ---------- skins (data) ----------
const SKINS=[
  {id:'classic', name:'Классика',        price:0,  look:{sweater:'#6f98c9', pants:'#5f8f45'}},
  {id:'red',     name:'Красный свитер',  price:30, look:{sweater:'#d1495b', pants:'#3d405b'}},
  {id:'hat',     name:'Шапка',           price:50, look:{sweater:'#6f98c9', pants:'#5f8f45', hat:'#f4a261'}},
  {id:'scarf',   name:'Шарф',            price:40, look:{sweater:'#6f98c9', pants:'#5f8f45', scarf:'#e9c46a'}},
  {id:'pro',     name:'Всё вместе',      price:0,  adOnly:true, look:{sweater:'#2a9d8f', pants:'#264653', hat:'#e76f51', scarf:'#f4a261'}}
];
const skinById=id=>SKINS.find(s=>s.id===id)||SKINS[0];

// ---------- persistent state (localStorage, this browser only) ----------
const CHEST_MS=24*3600*1000;
let rows=[], camR=-0.2, cat=null, catV=null;
let state='menu', score=0, runFish=0, revived=false, started=false, deadT=0, deadWhy='', time=0, queued=null;
let overShown=false, dblUsed=false, deaths=0;
let hitStop=0, shakeT=0, shakeAmp=0;
let best=0, totalFish=0, owned=['classic'], equipped='classic';
try{
  best=+localStorage.getItem('sam_best')||0;
  totalFish=+localStorage.getItem('sam_fish')||0;
  owned=JSON.parse(localStorage.getItem('sam_owned')||'["classic"]');
  equipped=localStorage.getItem('sam_skin')||'classic';
}catch(e){}
function save(){
  try{
    localStorage.setItem('sam_best',best); localStorage.setItem('sam_fish',totalFish);
    localStorage.setItem('sam_owned',JSON.stringify(owned)); localStorage.setItem('sam_skin',equipped);
  }catch(e){}
}

// ---------- sound ----------
let ac=null;
function beep(f,d,type,vol){
  try{
    if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'square'; o.frequency.value=f; g.gain.value=vol||0.04;
    o.connect(g); g.connect(ac.destination);
    const t=ac.currentTime; g.gain.setValueAtTime(vol||0.04,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.start(t); o.stop(t+d);
  }catch(e){}
}

// ---------- rows (data) ----------
const CAR_COLORS=['#e84a5f','#2ec4b6','#ffbe0b','#8338ec','#ff7b00','#3a86ff','#f15bb5'];
function genRow(r){
  const prev=rows[r-1];
  const bio=biomeOf(r);
  let type='grass';
  if(r>=3){
    const p=Math.random();
    if(prev.type==='grass') type = p<.62?'road':(p<.80?'rail':'grass');
    else if(prev.type==='road') type = p<.45?'road':(p<.58?'rail':'grass');
    else type = p<.5?'grass':'road';
    if(bio.river && prev.type!=='river' && type==='road' && Math.random()<.45) type='river';
    if(prev.type==='road' && prev.run>=4) type='grass';
  }
  const row={type:type, r:r, run:(prev && type===prev.type && type!=='grass')?prev.run+1:1,
             group:null, danger:false, warnM:null};
  if(type==='grass'){
    row.obs=new Array(COLS).fill(false); row.fish=-1; row.fishM=null; row.power=-1; row.powerM=null;
    const n = r<3 ? 0 : 1+Math.floor(Math.random()*4);
    for(let i=0;i<n;i++){ const c=Math.floor(Math.random()*COLS); if(r<3 && c===4) continue; row.obs[c]=true; }
    if(Math.random()<.5){ row.obs[0]=true; }
    if(Math.random()<.5){ row.obs[COLS-1]=true; }
    if(r<3){ row.obs.fill(false); if(r>0){ row.obs[1]=true; row.obs[7]=true; } }
    if(r>=3){
      const free=[]; for(let c=0;c<COLS;c++) if(!row.obs[c]) free.push(c);
      if(free.length && Math.random()<.3) row.fish=free.splice(Math.floor(Math.random()*free.length),1)[0];
      if(free.length && Math.random()<.12) row.power=free[Math.floor(Math.random()*free.length)];
    }
  } else if(type==='road'){
    row.dir=Math.random()<.5?1:-1;
    row.speed=1.6+Math.random()*2.4+Math.min(r/70,1.8);
    row.cars=[];
    const loop=COLS+10; let x=-5+Math.random()*3;
    while(true){
      const truck=Math.random()<.3, w=truck?2.5:1.6;
      if(x+w+3 > -5+loop) break;
      row.cars.push({x:x, w:w, truck:truck, col:CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)], mesh:null});
      x+=w+3+Math.random()*3;
    }
  } else if(type==='river'){
    row.dir=Math.random()<.5?1:-1;
    row.speed=1.2+Math.random()*1.0;
    row.logs=[];
    let x=-5+Math.random()*2;
    while(x<COLS+5){
      const w=2+Math.floor(Math.random()*2);
      row.logs.push({x:x, w:w, mesh:null});
      x+=w+1.2+Math.random()*1.6;
    }
  } else {
    // railway: a fixed timetable, staggered per row
    row.dir=Math.random()<.5?1:-1;
    row.ph='idle'; row.t=1+(r*1.37)%3.5; row.len=15; row.x=0; row.speed=26;
    row.trainG=null; row.lightL=null; row.lightR=null;
  }
  rows[r]=row;
}
function ensureRows(n){ while(rows.length<=n) genRow(rows.length); }

function updateRows(dt){
  const a=Math.max(0,Math.floor(camR)-3), b=Math.ceil(camR)+30;
  ensureRows(b);
  for(let r=a;r<=b;r++){
    const row=rows[r];
    if(row.type==='road'){
      for(const c of row.cars){
        c.x+=row.dir*row.speed*dt;
        if(c.x>COLS+5) c.x-=COLS+10;
        else if(c.x+c.w<-5) c.x+=COLS+10;
      }
    } else if(row.type==='river'){
      for(const l of row.logs){
        l.x+=row.dir*row.speed*dt;
        if(l.x>COLS+5) l.x-=COLS+10;
        else if(l.x+l.w<-5) l.x+=COLS+10;
      }
    } else if(row.type==='rail'){
      row.t-=dt;
      if(row.ph==='idle' && row.t<=0){ row.ph='warn'; row.t=1.4; beep(880,.12,'square',.03); }
      else if(row.ph==='warn' && row.t<=0){ row.ph='pass'; row.x=row.dir>0?-row.len-1:COLS+1; beep(110,.5,'sawtooth',.05); }
      else if(row.ph==='pass'){
        row.x+=row.dir*row.speed*dt;
        if((row.dir>0 && row.x>COLS+2) || (row.dir<0 && row.x+row.len<-2)){ row.ph='idle'; row.t=3.5; }
      }
    }
  }
}

// ---------- row visuals ----------
function buildRow(row){
  const bio=biomeOf(row.r);
  const g=new THREE.Group();
  const z=row.r+0.5;
  let col;
  if(row.type==='grass') col = row.r%2 ? bio.grass[0] : bio.grass[1];
  else if(row.type==='road') col=bio.road;
  else if(row.type==='rail') col=bio.rail;
  else col='#3fa7d6';
  const floor=mesh(G.box,col,0,-0.1,z,30,0.2,1); floor.castShadow=false; g.add(floor);

  if(row.type==='grass'){
    for(let c=0;c<COLS;c++) if(row.obs[c]){ const t=makeTree(); t.position.set(wx(c+0.5),0,z); g.add(t); }
    if(row.fish>=0){ row.fishM=makeFish(); g.add(row.fishM); }
    if(row.power>=0){ row.powerM=makePower(); g.add(row.powerM); }
  } else if(row.type==='road'){
    for(let x=-4;x<=4;x++){ const d=mesh(G.box,'#eeeeee',x,0.015,z,0.5,0.02,0.12); d.castShadow=false; g.add(d); }
    row.warnM=mesh(G.box,'#ff3b30',0,0.03,z+0.44,30,0.02,0.12); row.warnM.castShadow=false; row.warnM.visible=false; g.add(row.warnM);
    for(const c of row.cars){ c.mesh=makeCar(c.w,c.truck,c.col,-row.dir); c.mesh.position.z=z; g.add(c.mesh); }
  } else if(row.type==='river'){
    for(let x=-4;x<=4;x+=2){ const d=mesh(G.box,'#9ee3ff',x,0.02,z,0.6,0.02,0.1); d.castShadow=false; g.add(d); }
    for(const l of row.logs){ l.mesh=makeLog(l.w); l.mesh.position.z=z; g.add(l.mesh); }
  } else {
    g.add(mesh(G.box,'#cfd4dc',0,0.03,z-0.22,30,0.05,0.07));
    g.add(mesh(G.box,'#cfd4dc',0,0.03,z+0.22,30,0.05,0.07));
    for(let x=-6;x<=6;x++) g.add(mesh(G.box,'#5b3d24',x,0.02,z,0.14,0.05,0.8));
    g.add(mesh(G.box,'#333333',-4.9,0.5,z,0.08,1,0.08));
    g.add(mesh(G.box,'#333333', 4.9,0.5,z,0.08,1,0.08));
    row.lightL=mesh(G.sph,'#5a1a17',-4.9,1.08,z,0.14,0.14,0.14); g.add(row.lightL);
    row.lightR=mesh(G.sph,'#5a1a17', 4.9,1.08,z,0.14,0.14,0.14); g.add(row.lightR);
    row.trainG=makeTrain(row.len); row.trainG.position.z=z; row.trainG.visible=false; g.add(row.trainG);
  }
  row.group=g;
  scene.add(g);
  syncRow(row);
}
function disposeRow(row){
  if(row.group) scene.remove(row.group);
  row.group=null;
  if(row.cars) for(const c of row.cars) c.mesh=null;
  if(row.logs) for(const l of row.logs) l.mesh=null;
  row.fishM=null; row.powerM=null; row.trainG=null; row.lightL=null; row.lightR=null; row.warnM=null;
}
// per-frame placement of the moving parts of one visible row
function syncRow(row){
  if(!row.group) return;
  if(row.type==='road'){
    for(const c of row.cars) if(c.mesh) c.mesh.position.x=wx(c.x+c.w/2);
    if(row.warnM) row.warnM.visible = row.danger && Math.floor(time*8)%2===0;
  } else if(row.type==='river'){
    for(const l of row.logs) if(l.mesh) l.mesh.position.x=wx(l.x+l.w/2);
  } else if(row.type==='rail'){
    const blink = row.ph==='warn' ? Math.floor(time*6)%2===0 : row.ph==='pass';
    row.lightL.material=mat(blink?'#ff3b30':'#5a1a17');
    row.lightR.material=mat(blink?'#5a1a17':'#ff3b30');
    row.trainG.visible = row.ph==='pass';
    if(row.ph==='pass') row.trainG.position.x=wx(row.x+row.len/2);
  } else {
    if(row.fishM){
      if(row.fish>=0){
        row.fishM.visible=true;
        row.fishM.position.set(wx(row.fish+0.5),0.35+Math.sin(time*4)*0.06,row.r+0.5);
        row.fishM.rotation.y=time*3;
      } else row.fishM.visible=false;
    }
    if(row.powerM){
      if(row.power>=0){
        row.powerM.visible=true;
        row.powerM.position.set(wx(row.power+0.5),0.55+Math.sin(time*3)*0.07,row.r+0.5);
        row.powerM.rotation.y=time*2;
      } else row.powerM.visible=false;
    }
  }
}
function manage(){
  const a=Math.max(0,Math.floor(camR)-3), b=Math.ceil(camR)+30;
  ensureRows(b);
  for(let r=Math.max(0,a-30);r<a;r++){ const row=rows[r]; if(row&&row.group) disposeRow(row); }
  for(let r=a;r<=b;r++){
    const row=rows[r]; if(!row) continue;
    if(!row.group) buildRow(row); else syncRow(row);
  }
}
function clearWorld(){ for(const row of rows) if(row) disposeRow(row); rows=[]; }

// ---------- cat lifecycle ----------
function rebuildCat(){
  if(catV) scene.remove(catV.g);
  catV=buildCat(skinById(equipped).look);
  scene.add(catV.g);
}
function resetCat(){
  cat={c:4,r:0,x:4,y:0,moving:false,t:0,fc:4,fr:0,tc:4,tr:0,faceAng:0,hopDur:0.12,shield:false,inv:0,landSq:0};
  if(!catV) rebuildCat();
  catV.g.visible=true;
}

// ---------- game flow ----------
function showMenu(){
  over.classList.remove('show'); hud.classList.remove('show'); pad.classList.remove('show');
  menu.classList.add('show'); refreshChest();
}
function startMenu(){
  clearWorld(); ensureRows(24); camR=-0.2; resetCat(); state='menu';
}
function startGame(){
  clearWorld(); ensureRows(24); camR=-0.2; resetCat();
  score=0; runFish=0; revived=false; started=false; deadT=0; queued=null; overShown=false; dblUsed=false;
  state='play';
  menu.classList.remove('show'); over.classList.remove('show'); shop.classList.remove('show');
  hud.classList.add('show'); pad.classList.add('show');
  $('dbl').style.display='';
  updateHud();
}
function updateHud(){ elScore.textContent=score; elFish.textContent='🐟 '+totalFish; }

function tryMove(dc,dr){
  if(state!=='play') return;
  if(cat.moving){ queued={dc:dc,dr:dr}; return; }
  const cc=Math.round(cat.x);
  const tc=cc+dc, tr=cat.r+dr;
  if(tc<0||tc>=COLS||tr<0) return;
  if(tr<Math.floor(camR)) return;
  ensureRows(tr+VR+2);
  const row=rows[tr];
  if(row.type==='grass' && row.obs[tc]){ beep(150,.06,'square',.03); return; }
  spawnDust(wx(cat.x+0.5), cat.r+0.5, 4, '#f4ecd8');
  cat.moving=true; cat.t=0; cat.fc=cat.x; cat.fr=cat.y; cat.tc=tc; cat.tr=tr;
  cat.hopDur=(biomeOf(cat.r).weather==='rain')?0.16:0.12;   // wet tarmac: slower hop
  cat.faceAng=Math.atan2(dc,dr);
  if(dr>0) started=true;
  beep(dr>0?520:380,.06,'square',.03);
}

function finishHop(){
  cat.moving=false; cat.c=cat.tc; cat.r=cat.tr; cat.x=cat.c; cat.y=cat.r;
  cat.landSq=0.12;
  spawnDust(wx(cat.c+0.5), cat.r+0.5, 6, '#f4ecd8');
  const row=rows[cat.r];
  if(cat.r>score){ score=cat.r; updateHud(); }
  if(row.type==='grass'){
    if(row.fish===cat.c){
      row.fish=-1; runFish++; totalFish++; updateHud();
      beep(900,.1,'triangle',.05); setTimeout(()=>beep(1250,.1,'triangle',.05),70);
      if(row.fishM) pops.push({obj:row.fishM, t:0});
      fxText('+1 🐟', wx(cat.c+0.5), 1.1, cat.r+0.5, '#ffffff');
    }
    if(row.power===cat.c){
      row.power=-1; cat.shield=true; beep(660,.12,'triangle',.05);
      fxText('щит!', wx(cat.c+0.5), 1.1, cat.r+0.5, '#7fe7ff');
    }
  }
  if(queued){ const q=queued; queued=null; tryMove(q.dc,q.dr); }
}

function die(why){
  if(state!=='play') return;
  if(why!=='late' && why!=='water'){
    if(cat.inv>0) return;
    if(cat.shield){
      cat.shield=false; cat.inv=1.2; shakeT=0.25; shakeAmp=0.18;
      fxText('щит спас!', wx(cat.x+0.5), 1.2, cat.y+0.5, '#7fe7ff');
      beep(520,.15,'triangle',.05);
      return;
    }
  }
  state='dead'; deadWhy=why; deadT=0; cat.moving=false;
  deaths++; overShown=false;
  hitStop=0.06; shakeT=0.45; shakeAmp=0.3;
  beep(why==='late'||why==='water'?200:120,.4,'sawtooth',.06);
}

function finishOver(){
  if(score>best){ best=score; }
  save();
  $('overTitle').textContent = deadWhy==='train' ? 'Сэма сбил поезд 🚂'
    : deadWhy==='car' ? 'Сэма сбила машина 🚗'
    : deadWhy==='water' ? 'Сэм упал в реку 🌊'
    : 'Сэм не успел 😿';
  $('oScore').textContent=score; $('oBest').textContent=best;
  $('oFish').textContent=runFish*(dblUsed?2:1);
  $('revive').style.display = revived?'none':'';
  $('dbl').style.display = dblUsed?'none':'';
  over.classList.add('show'); hud.classList.remove('show'); pad.classList.remove('show');
}

function revive(){
  revived=true;
  let r=Math.max(cat.r, Math.ceil(camR)+2);
  ensureRows(r+3);
  while(rows[r].type!=='grass'){ r++; ensureRows(r+3); }
  const row=rows[r]; let c=4;
  if(row.obs[c]){ for(let i=0;i<COLS;i++){ if(!row.obs[i]){ c=i; break; } } }
  cat.c=c; cat.r=r; cat.x=c; cat.y=r; cat.moving=false; cat.inv=1.0; queued=null;
  camR=Math.max(camR, r-4);
  state='play'; deadT=0; overShown=false;
  over.classList.remove('show'); hud.classList.add('show'); pad.classList.add('show');
}

function renderShop(){
  let html='';
  for(const s of SKINS){
    const isOwned=owned.indexOf(s.id)>=0, isOn=equipped===s.id;
    let status, btn;
    if(isOn){ status='надет'; btn='<button class="sm" disabled>✓</button>'; }
    else if(isOwned){ status='есть'; btn='<button class="sm" data-act="equip" data-id="'+s.id+'">Надеть</button>'; }
    else if(s.adOnly){ status='за рекламу'; btn='<button class="sm" data-act="adskin" data-id="'+s.id+'">Смотреть</button>'; }
    else { status=s.price+' 🐟'; btn='<button class="sm" data-act="buy" data-id="'+s.id+'" '+(totalFish<s.price?'disabled':'')+'>Купить</button>'; }
    html+='<div class="card"><div><b>'+s.name+'</b><br><small>'+status+'</small></div>'+btn+'</div>';
  }
  $('shopList').innerHTML=html;
}
$('shopList').onclick=e=>{
  const act=e.target.dataset && e.target.dataset.act;
  if(!act) return;
  const id=e.target.dataset.id, s=skinById(id);

  else if(act==='adskin'){

};

// ---------- input ----------
window.addEventListener('keydown',e=>{
  const k=e.key;

  else if(k==='ArrowDown'||k==='s'||k==='S'){ e.preventDefault(); tryMove(0,-1); }

  else if(k==='ArrowRight'||k==='d'||k==='D'){ e.preventDefault(); tryMove(1,0); }
});
let px=0,py=0,pd=false;
canvas.addEventListener('pointerdown',e=>{ px=e.clientX; py=e.clientY; pd=true; });
canvas.addEventListener('pointerup',e=>{
  if(!pd) return; pd=false;
  const dx=e.clientX-px, dy=e.clientY-py;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20){ tryMove(0,1); return; }
  if(Math.abs(dx)>Math.abs(dy)) tryMove(dx>0?1:-1,0); else tryMove(0,dy<0?1:-1);
});

// ---------- update: fixed step of STEP seconds ----------
function update(dt){
  time+=dt;
  if(state==='dead'){
    deadT+=dt;
    if(deadT>0.8 && !overShown){
      overShown=true;
      if(deaths%3===0) showFullscreenAd(finishOver); else finishOver();
    }
    return;
  }
  if(state!=='play') return;

  if(cat.inv>0) cat.inv-=dt;
  if(cat.landSq>0) cat.landSq-=dt;
  updateRows(dt);

  if(cat.moving){
    cat.t+=dt/cat.hopDur;
    const k=Math.min(1,cat.t);
    cat.x=cat.fc+(cat.tc-cat.fc)*k; cat.y=cat.fr+(cat.tr-cat.fr)*k;
    if(cat.t>=1) finishHop();
  } else {
    const rr=rows[cat.r];
    if(rr && rr.type==='river'){             // standing on a log drifts with it
      cat.x+=rr.dir*rr.speed*dt;
      const cx=cat.x+0.5;
      const onLog=rr.logs.some(l=>cx>l.x+0.1 && cx<l.x+l.w-0.1);
      if(!onLog || cx<0 || cx>COLS){ die('water'); return; }
    }
  }

  // camera follows the cat; the world scrolls only after the first forward hop
  const speed=started?Math.min(0.28+score*0.004,1.1):0;
  const target=cat.y-3.6;
  camR=Math.max(camR+speed*dt, camR+(target-camR)*Math.min(1,dt*5));
  if(cat.y<camR-0.3){ die('late'); return; }

  // telegraph: the road row ahead flashes red while a car sits in the cat's column
  for(let r=cat.r;r<=cat.r+1;r++){
    const row=rows[r];
    if(!row || row.type!=='road') continue;
    row.danger=false;
    for(const c of row.cars){ if(c.x+c.w>cat.x-0.2 && c.x<cat.x+1.2){ row.danger=true; break; } }
  }

  // collisions in column/row units
  const r0=Math.floor(cat.y+0.0001), r1=Math.ceil(cat.y-0.0001);
  for(let r=r0;r<=r1;r++){
    const row=rows[r]; if(!row) continue;
    if(Math.abs(cat.y-r)>0.6) continue;
    const L=cat.x+0.22, R=cat.x+0.78;
    if(row.type==='road'){
      for(const c of row.cars){ if(R>c.x && L<c.x+c.w){ die('car'); return; } }
    } else if(row.type==='rail' && row.ph==='pass'){
      if(R>row.x && L<row.x+row.len){ die('train'); return; }
    }
  }
}

// ---------- draw ----------
function placeCat(){
  const hopK = cat.moving ? Math.sin(Math.min(1,cat.t)*Math.PI) : 0;
  catV.g.position.set(wx(cat.x+0.5), hopK*0.5, cat.y+0.5);
  catV.g.rotation.y=cat.faceAng;
  catV.shield.visible=cat.shield;
  if(state==='menu'){
    catV.g.position.y=Math.abs(Math.sin(time*3))*0.12;
    catV.body.scale.set(1,1+Math.sin(time*3)*0.02,1);
  } else if(state==='dead'){
    if(deadWhy==='late'||deadWhy==='water') catV.g.position.y=-Math.min(1.6,deadT*2.2);
    else catV.body.scale.set(1.25,0.18,1.25);
  } else {
    const land=cat.landSq>0?cat.landSq:0;
    const idle=(hopK||land)?0:Math.sin(time*3)*0.02;
    catV.body.scale.set(1+hopK*0.08+land*0.6, 1-hopK*0.12-land*0.9+idle, 1+hopK*0.08+land*0.6);
  }
  catV.tail.rotation.z=-0.6+Math.sin(time*5)*0.2;
  catV.g.visible = state==='dead' ? true : !(cat.inv>0 && Math.floor(time*12)%2===0);
}

const _c=new THREE.Color();
function paletteUpdate(dt){
  const bio=biomeOf(cat?cat.r:0), k=Math.min(1,dt*2);
  _c.set(bio.sky);
  scene.background.lerp(_c,k);
  scene.fog.color.lerp(_c,k);
  hemi.intensity+=(bio.hemi-hemi.intensity)*k;
  sun.intensity+=(bio.sun-sun.intensity)*k;
}

function draw(dt){
  const zc=camR+8;
  const amp = shakeT>0 ? shakeAmp*(shakeT/0.45) : 0;
  camera.position.set((Math.random()-.5)*2*amp, 9+(Math.random()-.5)*amp, zc-6.5+(Math.random()-.5)*amp);
  camera.lookAt(0,0,zc);
  sun.position.set(-6,14,zc-4);
  sun.target.position.set(0,0,zc);
  manage();
  if(cat && catV) placeCat();
  paletteUpdate(dt);
  precipUpdate(dt, biomeOf(cat?cat.r:0), zc);
  dustUpdate(dt);
  renderer.render(scene,camera);
  fxUpdate(dt);
}

// ---------- loop ----------
let last=performance.now(), acc=0;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  acc+=dt;
  while(acc>=STEP){
    if(hitStop>0) hitStop-=STEP;
    else update(STEP);
    acc-=STEP;
  }
  if(shakeT>0) shakeT-=dt;
  popsUpdate(dt);
  draw(dt);
  requestAnimationFrame(frame);
}
startMenu();
showMenu();
requestAnimationFrame(frame);
})();
</script>
